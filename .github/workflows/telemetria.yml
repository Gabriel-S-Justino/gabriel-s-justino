name: Atualizar telemetria
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telemetria.yml'
      - 'scripts/telemetria.py'
      - 'scripts/contribuicoes.graphql'

permissions:
  contents: write
concurrency:
  group: telemetria-diaria
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências gráficas
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
      - name: Consultar o calendário e gerar as imagens
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ github.repository_owner }}
        run: |
          gh api graphql -F query=@scripts/contribuicoes.graphql -f login="$PROFILE" > "$RUNNER_TEMP/calendar.json"
          python scripts/telemetria.py < "$RUNNER_TEMP/calendar.json"
      - name: Publicar imagens alteradas
        run: |
          git add assets/atlas/telemetria.gif assets/atlas/telemetria.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualiza a telemetria do perfil'
          git pull --rebase
          git push
